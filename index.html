<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>敏感ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: 顔写真登録 -->
  <div id="screen-photo">
    <h1>敏感ゲーム</h1>
    <p class="subtitle">顔写真を登録してね</p>

    <label class="upload-btn" for="file-input">📷 写真を選ぶ</label>
    <input type="file" id="file-input" accept="image/*" capture="user">

    <div class="preview-wrap">
      <img id="preview" alt="">
    </div>

    <button id="start-btn" disabled>ゲームスタート！</button>
  </div>

  <!-- Screen 2: ゲーム -->
  <div id="screen-game" hidden>

    <!-- 敏感ヒット時のフルスクリーンオーバーレイ -->
    <div id="sensitive-overlay" class="hidden"></div>

    <div id="figure-container">
      <img id="body-illustration" src="assets/body.jpg" alt="体">
      <img id="face-photo" alt="顔">

      <!--
        虫眼鏡ボタン 9箇所 (top/leftは body.jpg 608×1718px 基準)
      -->
      <button class="magnify-btn" data-index="0" style="top:21%;left:25%">🔍</button><!-- 左肩 -->
      <button class="magnify-btn" data-index="1" style="top:21%;left:68%">🔍</button><!-- 右肩 -->
      <button class="magnify-btn" data-index="2" style="top:30%;left:30%">🔍</button><!-- 左胸 -->
      <button class="magnify-btn" data-index="3" style="top:30%;left:62%">🔍</button><!-- 右胸 -->
      <button class="magnify-btn" data-index="4" style="top:42%;left:12%">🔍</button><!-- 左ひじ -->
      <button class="magnify-btn" data-index="5" style="top:42%;left:80%">🔍</button><!-- 右ひじ -->
      <button class="magnify-btn" data-index="6" style="top:47%;left:46%">🔍</button><!-- お腹 -->
      <button class="magnify-btn" data-index="7" style="top:68%;left:33%">🔍</button><!-- 左太もも -->
      <button class="magnify-btn" data-index="8" style="top:68%;left:58%">🔍</button><!-- 右太もも -->
    </div>

    <div id="result-banner" class="hidden"></div>
    <button id="reset-btn">最初から</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
