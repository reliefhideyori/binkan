<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>敏感ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: 顔写真登録 -->
  <div id="screen-photo">
    <h1>敏感ゲーム</h1>
    <p class="subtitle">顔写真を登録してね</p>

    <label class="upload-btn" for="file-input">📷 写真を選ぶ</label>
    <input type="file" id="file-input" accept="image/*" capture="user">

    <div class="preview-wrap">
      <img id="preview" alt="">
    </div>

    <button id="start-btn" disabled>ゲームスタート！</button>
  </div>

  <!-- Screen 2: ゲーム -->
  <div id="screen-game" hidden>
    <div id="figure-container">
      <img id="body-illustration" src="assets/body.png" alt="体">
      <img id="face-photo" alt="顔">

      <!--
        虫眼鏡ボタン 9箇所
        ※ top/left の % は body.png のサイズに合わせて調整可
      -->
      <button class="magnify-btn" data-index="0" style="top:27%;left:18%">🔍</button><!-- 左肩 -->
      <button class="magnify-btn" data-index="1" style="top:27%;left:72%">🔍</button><!-- 右肩 -->
      <button class="magnify-btn" data-index="2" style="top:37%;left:26%">🔍</button><!-- 左胸 -->
      <button class="magnify-btn" data-index="3" style="top:37%;left:64%">🔍</button><!-- 右胸 -->
      <button class="magnify-btn" data-index="4" style="top:48%;left:7%">🔍</button><!-- 左ひじ -->
      <button class="magnify-btn" data-index="5" style="top:48%;left:83%">🔍</button><!-- 右ひじ -->
      <button class="magnify-btn" data-index="6" style="top:53%;left:44%">🔍</button><!-- お腹 -->
      <button class="magnify-btn" data-index="7" style="top:70%;left:28%">🔍</button><!-- 左太もも -->
      <button class="magnify-btn" data-index="8" style="top:70%;left:62%">🔍</button><!-- 右太もも -->
    </div>

    <div id="result-banner" class="hidden"></div>
    <button id="reset-btn">最初から</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
