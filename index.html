<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>敏感ゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: 顔写真登録 -->
  <div id="screen-photo">
    <h1>敏感ゲーム</h1>
    <p class="subtitle">顔写真を登録してね</p>

    <label class="upload-btn" for="file-input">📷 写真を選ぶ</label>
    <input type="file" id="file-input" accept="image/*">

    <div class="preview-wrap">
      <img id="preview" alt="">
    </div>

    <button id="start-btn" disabled>ゲームスタート！</button>
  </div>

  <!-- Screen 2: ゲーム -->
  <div id="screen-game" hidden>
    <div id="sensitive-overlay" class="hidden"></div>

    <div id="figure-container">
      <img id="body-illustration" src="assets/body.jpg" alt="体">
      <img id="face-photo" alt="顔">

      <!--
        ボタン5箇所（肩・腕を削除）
        ※ ボタン内の番号はデバッグ用（位置調整後に🔍に戻す）
      -->
      <button class="magnify-btn" data-index="0" style="top:30%;left:31%"><span class="btn-label">①左胸</span></button>
      <button class="magnify-btn" data-index="1" style="top:30%;left:62%"><span class="btn-label">②右胸</span></button>
      <button class="magnify-btn" data-index="2" style="top:56%;left:46%"><span class="btn-label">③腹</span></button>
      <button class="magnify-btn" data-index="3" style="top:74%;left:36%"><span class="btn-label">④左腿</span></button>
      <button class="magnify-btn" data-index="4" style="top:74%;left:58%"><span class="btn-label">⑤右腿</span></button>
    </div>

    <div id="result-banner" class="hidden"></div>

    <div id="game-actions">
      <button id="reset-btn">もう一度</button>
      <button id="back-btn">写真を変える</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
